services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: toqui
      POSTGRES_USER: toqui
      POSTGRES_PASSWORD: toqui
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toqui"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    # The image's ENTRYPOINT is /server; override it to run the migrator.
    entrypoint: ["/migrate"]
    command: ["-direction", "up"]
    environment:
      DATABASE_URL: "postgres://toqui:toqui@postgres:5432/toqui?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations

  backend:
    build: .
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      DATABASE_URL: "postgres://toqui:toqui@postgres:5432/toqui?sslmode=disable"
      JWT_SECRET: "dev-secret-change-in-production"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "http://localhost:3000/auth/callback"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      VERTEX_AI_PROJECT_ID: "${VERTEX_AI_PROJECT_ID:-toqui-staging}"
      VERTEX_AI_LOCATION: "${VERTEX_AI_LOCATION:-us-central1}"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
